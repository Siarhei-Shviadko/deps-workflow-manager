{{- if .Values.vault_settings.azure_key_vault }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "3"
spec:
  provider: azure
  secretObjects:
  - data:
    - key: workflow-manager-db-password
      objectName: workflow-manager-db-password
    - key: workflow-manager-db-user
      objectName: workflow-manager-db-user
    - key: db-host
      objectName: db-host
    - key: workflow-manager-db
      objectName: workflow-manager-db
    secretName: {{ .Values.secrets.deps_worflow_manager_migrator.secretName }}
    type: Opaque
  parameters:
    keyvaultName: {{ .Values.azure_kv_settings.keyvaultName }} 
    tenantId: {{ .Values.azure_kv_settings.tenantId }}  
    vaultKubernetesMountPath: {{ .Values.csi.vaultKubernetesMountPath }}
    usePodIdentity: "false"
    useVMManagedIdentity: "true" 
    userAssignedIdentityID: {{ .Values.azure_kv_settings.userAssignedIdentityID }}  
    resourceGroup:  {{ .Values.azure_kv_settings.resourceGroup }} 
    subscriptionId: {{ .Values.azure_kv_settings.subscriptionId }}  
    objects: |
      array:
        - |
          objectName: "db-host"
          objectType: secret

        - |
          objectName: "workflow-manager-db"
          objectType: secret

        - |
          objectName: "workflow-manager-db-password"
          objectType: secret

        - |
          objectName: "workflow-manager-db-user"
          objectType: secret
{{- end }}
