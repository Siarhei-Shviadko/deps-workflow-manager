migrator:
  image:
    path: "/deps-platform/deps-workflow-manager-migrator"

workflow_manager_settings:
  ENV: ins
  FILE_STORAGE_URL: 'http://file-storage-nginx:8000/api/storage/v1/file'
  FILE_STORAGE_EXTERNAL_URL: 'https://ins-host/api/storage/v1/file'

  DATABASE_DB: workflow-manager-ins
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

  LOG_LEVEL: "INFO"

migration_settings:
  DATABASE_DB: workflow-manager-ins
  DATABASE_REQUIRE_SECURE_TRANSPORT: false

helm:
  enabled: false

csi:
  vault_namespace: 'k8s-ins'
  roleName: 'k8s-ins'
  vaultKubernetesMountPath: 'kubernetes-ins'

service_account:
  serviceAccountName: 'deps-insurance'
