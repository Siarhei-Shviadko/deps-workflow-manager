{{- if .Values.vault_settings.gcp_secret_manager }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.csi.csi_default_name }}
spec:
  provider: gcp
  parameters:
    secrets: |
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-database-host/versions/latest" 
        fileName: "db-host"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-workflow-manager-db-user/versions/latest" 
        fileName: "workflow-manager-db-user"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-workflow-manager-db-password/versions/latest" 
        fileName: "workflow-manager-db-password"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-workflow-manager-db/versions/latest" 
        fileName: "workflow-manager-db"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/message-broker-driver/versions/latest" 
        fileName: "message-broker-driver"
      - resourceName: "projects/{{ .Values.secret_project_id.id }}/secrets/{{ .Values.env }}-message-broker-connection-string/versions/latest" 
        fileName: "message-broker-connection-string"
  secretObjects:
    - secretName: {{ .Values.secrets.deps_workflow_manager.secretName }}
      type: Opaque
      data:
      - objectName: "message-broker-connection-string"
        key: message-broker-connection-string
      - objectName: "message-broker-driver"
        key: message-broker-driver
      - objectName: "db-host"
        key: db-host
      - objectName: "workflow-manager-db-user"
        key: workflow-manager-db-user
      - objectName: "workflow-manager-db-password"
        key: workflow-manager-db-password
      - objectName: "workflow-manager-db"
        key: workflow-manager-db
{{- end }}
