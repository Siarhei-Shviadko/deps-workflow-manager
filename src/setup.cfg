[tool:pytest]
cache_dir = /tmp/test_cache/.pytest_cache

[flake8]
ignore =
    # Missing docstring in public module
    D100,
    # Missing docstring in public class
    D101,
    # Missing docstring in public function
    D103,
    # Missing docstring in public package
    D104,
    # Do not perform function calls in argument defaults.  The call is performed only once at function definition time.
    B008,
    # Class without a base class
    WPS306,
    # Found a line that starts with a dot
    WPS348,
    # Found too short name
    WPS111,
    # Missing docstring in __init__
    D107,
    # Missing docstring in public method
    D102,
    # Missing parameter(s) in Docstring
    DAR101,
    # Missing "Returns" in Docstring
    DAR201,
    # Found commented out code
    E800,
    # Found `f` string
    WPS305,
    # Line break before binary operator
    W503,
    # Found upper-case constant in a class
    WPS115,
    # Found subclassing a builtin
    WPS600,
    # Double quotes found but single quotes preferred
    Q000,
    # Found module with too many imports
    WPS201,
    # Found too many arguments
    WPS211,
    # Found local folder import
    WPS300,
    # Found complex default value
    WPS404,
    # Found too long ``try`` body length
    WPS229,
    # Found `__init__.py` module with logic
    WPS412,
    # Found wrong keyword: pass
    WPS420,
    # Found nested class:
    WPS431,
    # Found wrong variable name
    WPS110,
    # Missing docstring in public nested class
    D106,
    # Found string constant over-use
    WPS226,
    # Found a too complex `f` string
    WPS237,
    # Found line with high Jones Complexity: 16 > 14
    WPS221,
    # Found wrong function call
    WPS421,
    # Remove all docstring rules
    D,
    # Found shadowed class attribute
    WPS601,
    # Found using `@staticmethod`
    WPS602,
    # Found incorrect node inside `class` body
    WPS604,
    # Found walrus operator
    WPS332,
    # Found string formatting
    WPS323,
    # Found wrong metadata variable: __all__
    WPS410,
    # used; unable to detect undefined names
    F403,
    # Found vague import that may cause confusion: *
    WPS347,
    F405,
    # Found block variables overlap: *
    WPS440,
    # Found too many methods
    WPS214,
    # Found implicit string concatenation
    WPS326,
    # Found inconsistent `return` statement
    WPS324,
    N818,
    WPS473,

exclude =
    .git,
    __pycache__,
    tests,
    vendors,
    .venv,
    __init__.py,

per-file-ignores =
    src/tests/*.py: S101
    ./deps_workflow_manager/entrypoint.py: WPS433, WPS430, WPS213
    ./deps_workflow_manager/messaging/sagas_data/template_processing.py: WPS214
    ./deps_workflow_manager/messaging/sagas_data/template/template_creation_data.py: WPS230
    ./deps_workflow_manager/messaging/sagas_data/template/template_creation_steps.py: WPS204
    ./deps_workflow_manager/application/workflow_service.py: WPS235
    */serializers/*: WPS425
    */steps/*: WPS212, WPS231, WPS223
    ./deps_workflow_manager/messaging/sagas_data/document_processing/document_processing.py: WPS235, WPS430
    ./deps_workflow_manager/messaging/sagas_data/typeless_document_processing/typeless_document_processing.py: WPS430
    ./deps_workflow_manager/messaging/saga_handlers/*: WPS428
    ./deps_workflow_manager/messaging/sagas/document_processing.py: WPS235
    ./deps_workflow_manager/messaging/dispatcher.py: WPS235
    ./deps_workflow_manager/extras/*: S105, WPS112, WPS615, WPS112, WPS231, WPS338, WPS608, WPS331, P101, WPS430, WPS232, WPS220, WPS433

max-local-variables = 15
max-methods = 12
max-line-length = 120
max-module-members = 15

[mypy]
ignore_missing_imports = True
follow_imports = skip
follow_imports_for_stubs = False
cache_dir = /tmp/test_cache/.mypy_cache
strict_optional = False
disable_error_code = attr-defined, name-defined

[isort]
profile = black
multi_line_output = 3
skip =
    vendors
    .venv

[coverage:run]
omit =
    tests/*
    */__init__.py
    /app/.venv/*
    /vendors/*
branch = True
data_file = /tmp/test_cache/.coverage

[ipdb]
context = 21
